const q=new URLSearchParams(location.search),en=q.get('lang')==='en',n=Number(q.get('slide')||1),lang=en?'en':'zh';
const copy=[['留住值得记下的<strong>发现</strong>','Keep what <strong>matters.</strong>','把浏览时的发现，留在 Rote。','Useful things you find online. Saved in Rote.'],['看到，<strong>保存。</strong>','See it. <strong>Save it.</strong>','熟悉的页面，多一个保存入口。','A familiar page. One more way to save.'],['留下<strong>这一段</strong>','Keep <strong>this passage.</strong>','选中文字，右键保存。来源也一起留下。','Select a passage. Save it with its source.'],['文字与图片，<strong>一起留下</strong>','Keep words and images <strong>together.</strong>','在支持的页面，连同静态图片一起保存。','Capture text and static images on supported pages.'],['按你的习惯<strong>收好</strong>','Save it <strong>your way.</strong>','默认标签、可见性与归档，由你决定。','Your tags, visibility and archive preference.']][n-1];document.querySelector('#title').innerHTML=copy[en?1:0];document.querySelector('#subtitle').textContent=copy[en?3:2];canvas.classList.add(['hero','two','passage','images','settings'][n-1]);if(en)canvas.classList.add('en');
const svg=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;const sprout='<svg class="sprout" viewBox="0 0 24 24"><path d="M12 12C5 14 1 9 1 4c7-1 11 2 11 8ZM13 15c-1-7 3-10 10-9 0 6-4 10-10 9ZM11 12h2v10h-2z"/></svg>';const star=svg('m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z'),fork=svg('M6 3v5c0 3 12 2 12 6v6M18 3v5c0 3-6 2-6 6v6'),copyIcon=svg('M9 5V3h6v2M9 5H6v17h14V5h-5M9 5v3h6V5'),more=svg('M4 12h.1M12 12h.1M20 12h.1'),bookmark=svg('M6 3h12v19l-6-4-6 4z');

const arrow='<svg class="arrow" viewBox="0 0 195 163"><path d="M22 142C10 55 78 16 162 75M144 43l21 36-40 2"/></svg>';
const repo=()=>`<div class="repo"><h2 class="repo-title">octocat / <b>Hello-World</b></h2><div class="repo-actions"><div class="github-btn">${fork}Fork <span class="counter">6.7k</span></div><div class="github-btn">${star}Star <span class="counter">3.8k</span></div><div class="github-btn">${sprout}${en?'Save to Rote':'保存到 Rote'}</div></div><div class="repo-about"><b>About</b>My first repository on GitHub!</div><div class="repo-file">README<br>Hello World!</div></div>`;
const note=(kind,w='')=>`<img class="note" ${w} src="../sources/${kind}-${lang}.png">`;
if(n===1)visual.innerHTML=`<section class="panel source">${bar('octocat / Hello-World')}${address('github.com/octocat/Hello-World')}${repo()}</section><section class="panel result">${rotebar()}${note('note')}</section>${arrow}`;
if(n===2)visual.innerHTML=`<section class="panel source">${bar('bsky.app')}<div class="post"><b>${en?'My collection':'我的收藏'}</b><div class="dim">@demo</div><p>${en?'A small discovery, saved for later.':'把今天的小发现，留给以后的自己。'}</p><div class="post-tools">${svg('M3 3h18v15H8l-5 4z')}${svg('M4 7h14l-4-4M20 17H6l4 4')}${svg('M12 21 3 12C-2 4 8 0 12 7c4-7 14-3 9 5z')}${bookmark}${more}</div></div></section><div class="menu post-menu"><div class="menu-row">${en?'Translate':'翻译'}${svg('M3 4h12M9 2v2M5 4c0 8 7 9 9 10M12 4c0 8-7 9-9 10M14 22l4-10 4 10M16 18h4')}</div><div class="menu-row">${en?'Copy post text':'复制帖子文本'}${copyIcon}</div><div class="menu-row active">${en?'Save to Rote':'保存到 Rote'}${sprout}</div></div><section class="panel result">${bar('github.com')}${repo()}</section>${arrow}`;
const passage=en?'A good note leaves a trail for your future self.\nKeep the part that matters.':'好的记录，是给未来的自己留一条线索。\n不必写很多，留住真正有用的一段就好。';
if(n===3)visual.innerHTML=`<section class="panel source">${bar('rote.ink')}<div class="article"><h2>${en?'A trail for your future self':'给未来的自己留一条线索'}</h2><p class="selected"><span>${passage}</span></p></div></section><div class="menu context"><div class="menu-row">${en?'Copy':'复制'}<span>⌘C</span></div><hr><div class="menu-row active">${sprout}<span style="flex:1">${en?'Save selection to Rote':'保存选中文字到 Rote'}</span></div><div class="menu-row">${en?'Inspect':'检查'}</div></div><section class="panel result">${rotebar()}${note('selection')}</section>${arrow}`;
if(n===4)visual.innerHTML=`<section class="panel source">${bar(en?'A small discovery':'今天的小发现')}<div class="post"><p>${en?'A small discovery, saved for later.':'把今天的小发现，留给以后的自己。'}</p><img class="photo" src="../sources/demo-woodland.png"></div></section><section class="panel result">${rotebar()}${note('image')}</section>${arrow}<img class="toast" src="../sources/toast-${lang}.png">`;
if(n===5)visual.innerHTML=`<section class="panel source">${bar(en?'Capture preferences':'采集偏好')}<div class="pref-demo"><label class="pref-label">${en?'Default tags':'默认标签'}</label><div class="pref-input">${en?'Saved':'收藏'}</div><label class="pref-label">${en?'Default visibility':'默认可见性'}</label><div class="pref-input">${en?'Private':'私密'}<span>⌄</span></div><div class="pref-toggle">${en?'Archive by default':'默认归档'}<span class="switch"><i></i></span></div><p class="pref-help">${en?'New captures go straight to your archive.':'新采集的笔记直接归档。'}</p></div></section><section class="panel result">${rotebar()}<img class="tasks" src="../sources/tasks-${lang}.png"></section><img class="toast" src="../sources/toast-${lang}.png">`;
</script></body></html>
